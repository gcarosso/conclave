name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Router tests (offline, fake vendor)
        run: make router-test
      - name: Publish-gate fixtures
        run: make gate-test
      - name: Docs links and anchors
        run: make check-links
      - name: End-to-end in a temporary hub (fake vendor CLIs)
        run: make e2e
      - name: Lint (shellcheck + py_compile)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint
